<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
<h2 class="text-center mb-4">Task Manager</h2>

<div class="card p-3 mb-4">
<input type="hidden" id="taskId">

<div class="mb-2">
<input type="text" id="title" class="form-control" placeholder="Task Title">
</div>

<div class="mb-2">
<textarea id="description" class="form-control" placeholder="Description"></textarea>
</div>

<button class="btn btn-primary" onclick="addTask()">Save Task</button>
</div>


<div id="taskList"></div>

</div>

<script src="index.js"></script>

</body>
</html>
