<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <link rel="stylesheet" href="style.css" />
  <body>
    <div class="container d-flex justify-content-center align-items-center">
      <!-- Form -->
      <div class="card p-3 mb-4 ad-1" style="width: 550px">
        <h2 class="text-center mt-4 fst-italic">Task Manager</h2>
        <input type="hidden" id="taskId" />

        <div class="mb-2">
          <input
            type="text"
            id="title"
            class="form-control"
            placeholder="Task Title"
          />
        </div>

        <div class="mb-2">
          <input
            type="date"
            id="date"
            class="form-control"
            placeholder="Task Title"
          />
        </div>

        <div class="mb-2">
          <textarea
            id="description"
            class="form-control"
            placeholder="Description"
          ></textarea>
        </div>

        <button class="btn btn-primary" onclick="addTask()">Save Task</button>

        <table class="table table-bordered text-center mt-4">
          <thead>
            <tr>
             
              <th>Title</th>
              <th>description</th>
              <th>Date</th>
              <th>Edit</th>
              <th>Remove</th>
            </tr>
          </thead>

          <tbody id="taskList"></tbody>
        </table>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
