<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>question Project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center min-vh-100"
    >
      <div class="row  p-3 Quiz-card rounded-4">
        <div class="card shadow">
          <h2 class="fw-bold fst-italic text-center text-primary">
            Quiz Application
          </h2>

          <div class="d-flex justify-content-between mt-3">
            <span id="qnsNumber" class="fs-5">question 1/10</span>
            <span id="qnsTimer" class="text-center text-danger fs-3">30</span>
          </div>

          <h3 id="qns" class="text-center">
            quiz question will be appeared here
          </h3>

          <div id="options" class="option row g-3 text-center mt-3"></div>

          <button id="nextBtn" class=" mt-3 mb-2 blackb" onclick="nextbutton()">
            next
          </button>

          <div id="Qns-Result"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="index.js"></script>
  </body>
</html>
