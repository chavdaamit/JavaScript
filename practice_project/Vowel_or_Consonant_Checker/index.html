<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel or Consonant Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <form id="form">

            <div class="adss">

<br>
                <h3 id="result"></h3>
            </div>
        </form>

    </div>


    <script src="index.js"></script>
