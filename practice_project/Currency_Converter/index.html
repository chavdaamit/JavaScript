<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

    <form id="form">

        <div class="adss">

        <label for="">Currency Converter</label><br><br>
        <input type="number" id="amount" placeholder="Enter your amount" required>
        <br><br>
        <select name="" id="type">


            <option value="usdToInr">USD to INR</option>
            <option value="inrToUsd">INR to USD</option>

        </select><br><br>
        <button class="btn-grad" type="submit">Convert</button>
<br><br>
        <h3 id="result"></h3>
</div>


    </form>

</div>

    <script src="index.js"></script>
</body>

</html>
