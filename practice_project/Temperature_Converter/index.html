<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="container">

        <form id="form">

            <div class="adss">

                <label for="">Temperature Converter</label> <br><br>
                <input type="number" id="temp" placeholder="Enter Temperature" required>
                <br><br>
                <select name="" id="type">

                    <option value="c2f">Celsius to Fahrenheit</option>
                    <option value="f2c">Fahrenheit to Celsius</option>

                </select><br><br>

                <button class="btn-grad" type="submit">Convert</button>
                <br>
                <h3 id="result"></h3>

        </form>
    </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
