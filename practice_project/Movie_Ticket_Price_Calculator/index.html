<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Price Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">


        <form id="form">
            <div class="adss">

            <label>Enter Age:</label><br><br>
            <input type="number" id="age" placeholder="Enter your Age" required><br><br>

            <label>Select Show:</label><br><br>
            <select id="show">
                <option value="morning">Morning</option>
                <option value="evening">Evening</option>
            </select><br><br>

            <button class="btn-grad " type="submit">Check Price</button><br><br>
            <h3 id="result"></h3>
            </div>
        </form>


    </div>
    <script src="index.js"></script>
</body>

</html>
